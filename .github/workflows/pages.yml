name: Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Stage named files into _site rather than uploading the repo root.
      # Uploading the root once failed the artifact tar, because it contains
      # symlinks into submodules that this checkout does not fetch.
      # proto/ is safe to copy wholesale: plain HTML, no symlinks.
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html .nojekyll CNAME _site/
          cp -R proto _site/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
